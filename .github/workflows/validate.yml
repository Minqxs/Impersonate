name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Impersonate.sln
      - run: dotnet build Impersonate.sln --no-restore
      - run: dotnet test Impersonate.sln --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/impersonate-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run build
